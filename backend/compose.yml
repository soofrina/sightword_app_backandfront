services:
  db:
    image: postgres:14.5-alpine@sha256:7d794606b8f097c80348dcfb69852563a5136b157d9872715aee6633f6e2ade6
    container_name: sw-db
    volumes:
      - "postgres:/var/lib/postgresql/data"
    ports:
      - ${DB_PORT:-5432}:5432
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-sw-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
  development:
    build:
      context: .
    container_name: sw-dev
    ports:
      - ${PORT:-3000}:${PORT:-3000}
    depends_on:
      - db
    environment:
      NODE_ENV: development
      DB_HOST: sw-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-sw-db}
    volumes:
      - ./:/app
    command: yarn run start:dev
volumes:
  postgres:
